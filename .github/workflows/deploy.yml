name: Build Quadra Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quadra-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUADRA_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Avoid the action's interactive sdkmanager --licenses prompt.
          # Licenses are accepted explicitly in the next step.
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses non-interactively
        shell: bash
        run: |
          set -euo pipefail
          LICENSE_LOG="$RUNNER_TEMP/android-sdk-license-verification.log"

          # sdkmanager may close stdin after consuming its prompts. That makes
          # yes receive SIGPIPE; do not let yes' status mask sdkmanager's status.
          set +o pipefail
          yes 2>/dev/null | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

          # Verify independently with stdin closed: any remaining license prompt
          # defaults to "no" and is detected in the captured output.
          if ! sdkmanager --sdk_root="$ANDROID_HOME" --licenses </dev/null >"$LICENSE_LOG" 2>&1; then
            cat "$LICENSE_LOG"
            echo "Android SDK license verification command failed."
            exit 1
          fi
          cat "$LICENSE_LOG"
          if grep -Eqi '[0-9]+ of [0-9]+ SDK package licenses not accepted|Accept\\? \\(y/N\\)' "$LICENSE_LOG"; then
            echo "Android SDK licenses remain unaccepted."
            exit 1
          fi
          echo "All Android SDK package licenses are accepted."
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate web application and icon assets
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s quests.css
          test -s quests.js
          test -s icon.svg
          test -s quadra-icon.png
          test -s native/android/res/drawable-nodpi/quadra_icon.png
          test -s native/android/res/drawable/ic_launcher_foreground.xml
          test -s native/android/res/drawable/ic_launcher_monochrome.xml
          test -s native/android/res/drawable/quadra_icon_background.xml
          test -s native/android/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -Fq '.quest-backdrop[hidden]{display:none!important}' quests.css
          grep -Fq './icon.svg' manifest.webmanifest
          node --check app.js
          node --check quests.js
          node -e "const p=require('./package.json'); if(!p.dependencies['@capacitor/android']) process.exit(1)"
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          manifest=json.load(open('manifest.webmanifest', encoding='utf-8'))
          assert manifest['short_name']=='Quadra'
          assert any(i.get('src')=='./quadra-icon.png' and i.get('sizes')=='192x192' for i in manifest['icons'])
          for path in [
              'native/android/res/drawable/ic_launcher_foreground.xml',
              'native/android/res/drawable-nodpi/quadra_icon.png',
              'native/android/res/drawable/ic_launcher_monochrome.xml',
              'native/android/res/mipmap-anydpi/ic_launcher.xml',
              'native/android/res/mipmap-anydpi-v26/ic_launcher.xml',
              'native/android/res/mipmap-anydpi-v26/ic_launcher_round.xml',
              'native/android/res/values/quadra_icon_colors.xml'
          ]:
              ET.parse(path)
          print('Web and Android icon resources validated.')
          PY

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Install Quadra native Storage Access Framework bridge
        run: |
          set -euo pipefail
          PACKAGE_DIR=android/app/src/main/java/com/maluquinhodev/quadra
          mkdir -p "$PACKAGE_DIR"
          cp native/android/QuadraStoragePlugin.java "$PACKAGE_DIR/QuadraStoragePlugin.java"
          cp native/android/MainActivity.java "$PACKAGE_DIR/MainActivity.java"

      - name: Configure Android version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          lines = gradle.read_text(encoding="utf-8").splitlines()
          code = int(os.environ["QUADRA_VERSION_CODE"])
          code_count = 0
          name_count = 0
          for index, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode "):
                  lines[index] = f"{indent}versionCode {code}"
                  code_count += 1
              elif stripped.startswith("versionName "):
                  lines[index] = f'{indent}versionName "0.9.{code}"'
                  name_count += 1
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"Expected one versionCode and one versionName; found {code_count} and {name_count}.")
          gradle.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Android version configured: 0.9.{code} (code {code}).")
          PY

      - name: Sync application into Android
        run: npx cap sync android
      - name: Install adaptive and legacy launcher icons
        run: |
          set -euo pipefail
          RES_DIR=android/app/src/main/res
          mkdir -p "$RES_DIR/drawable" "$RES_DIR/drawable-nodpi" "$RES_DIR/mipmap-anydpi" "$RES_DIR/mipmap-anydpi-v26" "$RES_DIR/values"
          rm -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          cp native/android/res/drawable/ic_launcher_foreground.xml "$RES_DIR/drawable/ic_launcher_foreground.xml"
          cp native/android/res/drawable-nodpi/quadra_icon.png "$RES_DIR/drawable-nodpi/quadra_icon.png"
          cp native/android/res/drawable/ic_launcher_monochrome.xml "$RES_DIR/drawable/ic_launcher_monochrome.xml"
          cp native/android/res/drawable/quadra_icon_background.xml "$RES_DIR/drawable/quadra_icon_background.xml"
          cp native/android/res/mipmap-anydpi/ic_launcher.xml "$RES_DIR/mipmap-anydpi/ic_launcher.xml"
          cp native/android/res/mipmap-anydpi-v26/ic_launcher.xml "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          cp native/android/res/mipmap-anydpi-v26/ic_launcher_round.xml "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          cp native/android/res/values/quadra_icon_colors.xml "$RES_DIR/values/quadra_icon_colors.xml"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          path=Path('android/app/src/main/AndroidManifest.xml')
          tree=ET.parse(path)
          root=tree.getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          app=root.find('application')
          if app is None:
              raise SystemExit('AndroidManifest.xml has no application element')
          app.set(ns+'icon','@mipmap/ic_launcher')
          app.set(ns+'roundIcon','@mipmap/ic_launcher_round')
          tree.write(path,encoding='utf-8',xml_declaration=True)
          print('Launcher icon and roundIcon registered in AndroidManifest.xml')
          PY
          test -s "$RES_DIR/drawable/ic_launcher_foreground.xml"
          test -s "$RES_DIR/drawable-nodpi/quadra_icon.png"
          grep -Fq "@drawable/quadra_icon" "$RES_DIR/drawable/ic_launcher_foreground.xml"
          test -s "$RES_DIR/drawable/ic_launcher_monochrome.xml"
          grep -Fq 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -Fq '@drawable/quadra_icon_background' "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          grep -Fq '@drawable/ic_launcher_foreground' "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          app = manifest.find('application')
          ns = '{http://schemas.android.com/apk/res/android}'
          assert app is not None
          assert app.get(ns + 'icon') == '@mipmap/ic_launcher'
          assert app.get(ns + 'roundIcon') == '@mipmap/ic_launcher_round'
          for resource in [
              'drawable/ic_launcher_foreground.xml',
              'drawable-nodpi/quadra_icon.png',
              'drawable/ic_launcher_monochrome.xml',
              'mipmap-anydpi/ic_launcher.xml',
              'mipmap-anydpi-v26/ic_launcher.xml',
              'mipmap-anydpi-v26/ic_launcher_round.xml',
              'values/quadra_icon_colors.xml',
          ]:
              assert Path('android/app/src/main/res', resource).is_file(), resource
          print('Adaptive, round, monochrome and legacy launcher icon resources installed.')
          PY


      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK package, launcher icon and signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-debug.txt
          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging "$APK" | tee -a signing-debug.txt
          grep -Fq "application-icon" signing-debug.txt
          grep -Fq "application: label='Quadra'" signing-debug.txt

      - name: Upload debug APK and signature report
        uses: actions/upload-artifact@v4
        with:
          name: Quadra-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            signing-debug.txt
          if-no-files-found: error
          retention-days: 30
