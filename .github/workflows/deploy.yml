name: Build Quadra Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quadra-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUADRA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate web application
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          node --check app.js
          node -e "const p=require('./package.json'); if(!p.dependencies['@capacitor/android']) process.exit(1)"
          python -c "import json; d=json.load(open('manifest.webmanifest')); assert d['short_name']=='Quadra'"

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Install Quadra native Storage Access Framework bridge
        run: |
          PACKAGE_DIR=android/app/src/main/java/com/maluquinhodev/quadra
          mkdir -p "$PACKAGE_DIR"
          cp native/android/QuadraStoragePlugin.java "$PACKAGE_DIR/QuadraStoragePlugin.java"
          cp native/android/MainActivity.java "$PACKAGE_DIR/MainActivity.java"

      - name: Configure Android version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          lines = gradle.read_text(encoding="utf-8").splitlines()
          code = int(os.environ["QUADRA_VERSION_CODE"])
          code_count = 0
          name_count = 0

          for index, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode "):
                  lines[index] = f"{indent}versionCode {code}"
                  code_count += 1
              elif stripped.startswith("versionName "):
                  lines[index] = f'{indent}versionName "0.9.{code}"'
                  name_count += 1

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  f"Esperava uma ocorrência de cada versão; encontrei code={code_count}, name={name_count}."
              )

          gradle.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Versão Android configurada: 0.9.{code} (code {code}).")
          PY

      - name: Sync application into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK package and signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-debug.txt
          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:" | tee -a signing-debug.txt

      - name: Upload debug APK and signature report
        uses: actions/upload-artifact@v4
        with:
          name: Quadra-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            signing-debug.txt
          if-no-files-found: error
          retention-days: 30
,
              lambda match: f'{match.group(1)}versionName "0.9.{code}"',
              text,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Não foi possível atualizar versionCode/versionName no build.gradle gerado.")
          gradle.write_text(text, encoding="utf-8")
          print(f"Versão Android configurada: 0.9.{code} (code {code}).")
          PY

      - name: Sync application into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
