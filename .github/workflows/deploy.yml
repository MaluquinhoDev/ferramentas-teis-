name: Build Quadra Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quadra-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy "tools" SDK package.
          # Command-line tools are installed by setup-android itself.
          packages: platform-tools

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate web application
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          node --check app.js
          node -e "const p=require('./package.json'); if(!p.dependencies['@capacitor/android']) process.exit(1)"
          python -c "import json; d=json.load(open('manifest.webmanifest')); assert d['short_name']=='Quadra'"

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync application into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Quadra-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
