name: Publicar aplicativo Voz no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar PWA
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar arquivos do aplicativo
        shell: bash
        run: |
          set -euo pipefail
          test -s app/index.html
          test -s app/styles.css
          test -s app/app.js
          test -s app/config.js
          test -s app/manifest.webmanifest
          test -s app/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("app/manifest.webmanifest").read_text(encoding="utf-8"))
          print("Arquivos e manifest do PWA validados.")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
