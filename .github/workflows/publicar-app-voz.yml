name: Empacotar aplicativo Voz

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/publicar-app-voz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voz-app-package
  cancel-in-progress: true

jobs:
  empacotar:
    name: Validar e empacotar aplicativo
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar arquivos do aplicativo
        shell: bash
        run: |
          set -euo pipefail
          test -s app/index.html
          test -s app/styles.css
          test -s app/app.js
          test -s app/config.js
          test -s app/manifest.webmanifest
          test -s app/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("app/manifest.webmanifest").read_text(encoding="utf-8"))
          for path in ("app/index.html", "app/app.js", "app/config.js", "app/sw.js"):
              if not Path(path).read_text(encoding="utf-8").strip():
                  raise SystemExit(f"Arquivo vazio: {path}")
          print("Estrutura do PWA validada.")
          PY

      - name: Montar pacote com index.html na raiz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pacote
          cp -R app/. dist/pacote/
          cat > dist/pacote/LEIA-ME.txt <<'EOF'
          VOZ - APLICATIVO DE TEXTO PARA AUDIOBOOK

          IMPORTANTE: os arquivos do aplicativo ficam diretamente nesta pasta.
          Para executar no Linux Mint:
            1. Extraia todo o ZIP para uma pasta.
            2. Abra um terminal dentro da pasta extraída (onde está index.html).
            3. Execute: python3 -m http.server 8080
            4. Abra: http://localhost:8080

          Mantenha o terminal aberto enquanto usar o aplicativo.
          Para encerrar o servidor, pressione Ctrl+C no terminal.

          A interface funciona localmente, mas a conversão MP3 depende da
          implantação do Cloudflare Worker/R2 e da URL configurada em config.js.
          O endereço provisório COLOQUE-SEU-WORKER não permite converter.
          Para instalação PWA, é necessário hospedar em HTTPS ou localhost.
          EOF
          cd dist/pacote
          zip -qr ../voz-app-linux-celular.zip .
          cd ..
          sha256sum voz-app-linux-celular.zip > voz-app-linux-celular.sha256
          unzip -l voz-app-linux-celular.zip
          unzip -Z1 voz-app-linux-celular.zip | grep -qx 'index.html'

      - name: Disponibilizar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: voz-app-linux-celular
          path: |
            dist/voz-app-linux-celular.zip
            dist/voz-app-linux-celular.sha256
          if-no-files-found: error
          retention-days: 30
