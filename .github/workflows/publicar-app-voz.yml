name: Publicar aplicativo Voz

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/publicar-app-voz.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-voz
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar aplicativo
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
